# tmux configuration
#
# Tuned for long-lived agent sessions on the Mac Mini — the ones `proj` and `pm`
# create and leave running. Reload without restarting: tmux source-file ~/.tmux.conf

# Let programs inside tmux know when their pane gains or loses focus. Claude
# Code asks for this by name and warns when it is off; without it a session
# cannot tell whether you are actually looking at it.
set -g focus-events on

# The default 500ms delay after Escape is inherited from terminals that used it
# to disambiguate escape sequences. In a TUI it just makes Escape feel broken —
# and Escape is how you interrupt Claude Code.
set -sg escape-time 10

# The default 2000 lines of scrollback is little for an agent session, where a
# single tool call can outrun it. Deliberately not larger: this is held in RAM
# per pane, and the Mini's 16 GB is already the binding constraint on how many
# sessions can be resident at once. See headless-mac-mini/AGENTS.md.
set -g history-limit 20000

# Deliberately NOT set here:
#   mouse       — off is the current behaviour on the Mini; turning it on
#                 changes selection and copy/paste in ways worth choosing
#                 on purpose rather than inheriting from a config file.
#   prefix      — stays C-b, which is what every note and the `hello` splash
#                 documents.
